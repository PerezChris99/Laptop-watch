[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laptopwatch-owner-relay"
version = "0.3.0.dev0"
description = "Optional owner-provisioned signed and encrypted LaptopWatch metadata relay"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["laptopwatch_relay*"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
fcm = ["google-auth>=2.30,<3", "requests>=2.32,<3"]

[project.scripts]
laptopwatch-relay = "laptopwatch_relay.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
