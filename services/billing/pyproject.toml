[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "laptopwatch-billing"
version = "0.1.0"
description = "Paddle-signed billing events, subscriptions and Ed25519 device entitlements"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<47", "fastapi>=0.115,<1", "pydantic>=2,<3", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["laptopwatch_billing*"]

[project.scripts]
laptopwatch-billing = "laptopwatch_billing.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
