apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Owner-controlled opt-in. Default builds contain no configured Firebase app.
def laptopwatchFcmEnabled = providers.gradleProperty("laptopwatchFcmEnabled")
    .map { it.toBoolean() }.getOrElse(false)
if (laptopwatchFcmEnabled) {
    if (!file("google-services.json").isFile()) {
        throw new GradleException("FCM opt-in requires owner-provisioned android/app/google-services.json")
    }
    apply plugin: "com.google.gms.google-services"
}

// Standard React Native 0.88 autolinking. Native security modules are added
// explicitly in MainApplication, never registered through remote JS.
react {
    autolinkLibrariesWithApp()
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.kc.laptopwatch.mobile"

    defaultConfig {
        applicationId "com.kc.laptopwatch.mobile"
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        // Disabled by default. Cannot enable without an owner Firebase config.
        buildConfigField "boolean", "LAPTOPWATCH_FCM_ENABLED", laptopwatchFcmEnabled.toString()
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }
    buildTypes {
        debug {
            // React Native Metro debug bundler only. The paired HTTPS adapter
            // ALWAYS requires the QR certificate pin, even in debug builds.
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // No debug-signing fallback in release. Owner supplies release key.
        }
    }
    buildFeatures { buildConfig true }
    packagingOptions {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/INDEX.LIST"]
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("com.google.firebase:firebase-messaging:24.1.3")
    // Pure Java Ed25519 for Android 8+ foreground signed status polling.
    implementation("org.bouncycastle:bcprov-jdk18on:1.80")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation("io.github.react-native-community:jsc-android:2026004.+")
    }
}
