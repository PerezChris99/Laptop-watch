[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laptopwatch-companion"
version = "0.2.0.dev0"
description = "Security primitives for the LaptopWatch desktop companion"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<47", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["laptopwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
laptopwatch = "laptopwatch.cli:main"

[project.optional-dependencies]
media = ["opencv-python>=4.8,<5", "aiortc>=1.9,<2"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
