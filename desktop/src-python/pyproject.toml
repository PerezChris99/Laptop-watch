[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "laptopwatch-companion"
version = "0.2.0.dev0"
description = "Security primitives for the LaptopWatch desktop companion"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<47"]

[tool.setuptools.packages.find]
where = ["."]
include = ["laptopwatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
